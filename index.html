<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday! 🎂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root {
  --blush: #F9A8C9; --rose: #E8578A; --deep-rose: #C0365E;
  --lavender: #D8B4F8; --cream: #FFF7F0; --gold: #D4A853;
  --gold-light: #F5DEB3;
  --text-dark: #4A2040; --text-medium: #7A4A6A; --text-light: #A06A8A;
  --card-bg: rgba(255,255,255,0.6); --glass-border: rgba(255,255,255,0.4);
  --shadow-soft: 0 8px 32px rgba(200,80,130,0.15);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--blush) var(--cream)}
body{font-family:'Quicksand',sans-serif;background:var(--cream);color:var(--text-dark);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.no-scroll{overflow:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--cream)}::-webkit-scrollbar-thumb{background:var(--blush);border-radius:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}

.script{font-family:'Dancing Script',cursive}
.heading-xl{font-size:clamp(2.4rem,8vw,5rem);font-weight:700;line-height:1.1}
.heading-lg{font-size:clamp(1.8rem,5vw,3rem);font-weight:700}
.body-text{font-size:clamp(0.95rem,2.5vw,1.15rem);line-height:1.7;color:var(--text-medium)}
.section-tag{font-size:0.75rem;letter-spacing:3px;text-transform:uppercase;color:var(--rose);font-weight:600}

/* ═══ ENTRY ═══ */
#entry-screen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#fce4f1,#f0d0f7 40%,#d8e8fc);transition:opacity .8s,transform .8s}
#entry-screen.hide{opacity:0;transform:scale(1.1);pointer-events:none}
.entry-envelope{width:120px;height:90px;position:relative;cursor:pointer;animation:floatEnv 3s ease-in-out infinite}
.envelope-body{width:100%;height:100%;background:linear-gradient(135deg,#fff,#ffeef5);border-radius:6px;box-shadow:0 10px 40px rgba(200,80,130,.25);overflow:hidden}
.envelope-flap{position:absolute;top:-1px;left:-1px;right:-1px;height:50px;background:linear-gradient(135deg,#ffd6e8,#f0c0f0);clip-path:polygon(0 0,50% 100%,100% 0);animation:flapW 2s ease-in-out infinite 1s}
.envelope-heart{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:24px;animation:heartP 1.5s ease-in-out infinite}
@keyframes floatEnv{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-15px) rotate(2deg)}}
@keyframes flapW{0%,100%{transform:rotateX(0)}50%{transform:rotateX(15deg)}}
@keyframes heartP{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.2)}}
.entry-text{margin-top:30px;text-align:center}
.entry-text h2{font-family:'Dancing Script',cursive;font-size:clamp(1.5rem,5vw,2.2rem);color:var(--deep-rose);margin-bottom:8px}
.entry-text p{font-size:.9rem;color:var(--text-light)}
.open-btn{margin-top:35px;padding:14px 40px;border:none;border-radius:50px;cursor:pointer;background:linear-gradient(135deg,var(--rose),var(--lavender));color:#fff;font-family:'Quicksand',sans-serif;font-size:1rem;font-weight:600;box-shadow:0 6px 25px rgba(232,87,138,.35);transition:transform .3s;animation:glowP 2s ease-in-out infinite}
.open-btn:hover{transform:scale(1.06)}
@keyframes glowP{0%,100%{box-shadow:0 6px 25px rgba(232,87,138,.35)}50%{box-shadow:0 6px 40px rgba(232,87,138,.55)}}

/* ═══ PARTICLES ═══ */
.particles-container{position:fixed;inset:0;pointer-events:none;z-index:0}
.particle{position:absolute;border-radius:50%;opacity:.4;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0) scale(0);opacity:0}10%{opacity:.4;transform:translateY(90vh) rotate(36deg) scale(1)}90%{opacity:.3}100%{transform:translateY(-10vh) rotate(360deg) scale(.5);opacity:0}}

/* ═══ SECTIONS ═══ */
.section{position:relative;z-index:1;padding:80px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.reveal{opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s}
.reveal.visible{opacity:1;transform:translateY(0)}

/* ═══ HERO ═══ */
#hero{min-height:100vh;justify-content:center;background:linear-gradient(180deg,#fce4f1,var(--cream));overflow:hidden}
.hero-badge{display:inline-block;padding:6px 20px;border-radius:50px;background:rgba(232,87,138,.1);border:1px solid rgba(232,87,138,.2);font-size:.8rem;font-weight:600;color:var(--rose);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
.hero-name{font-family:'Dancing Script',cursive;font-size:clamp(3rem,12vw,7rem);font-weight:700;background:linear-gradient(135deg,var(--rose),var(--lavender),var(--gold));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s ease-in-out infinite;line-height:1.2;margin-bottom:10px}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero-sub{font-size:clamp(1rem,3vw,1.3rem);color:var(--text-light);max-width:450px;margin-top:10px}
.hero-emoji-row{margin-top:25px;font-size:2rem;display:flex;gap:15px}
.hero-emoji-row span{animation:bounceE 2s ease-in-out infinite;display:inline-block}
.hero-emoji-row span:nth-child(2){animation-delay:.3s}.hero-emoji-row span:nth-child(3){animation-delay:.6s}.hero-emoji-row span:nth-child(4){animation-delay:.9s}
@keyframes bounceE{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.scroll-hint{position:absolute;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-light);font-size:.75rem}
.scroll-arrow{width:20px;height:20px;border-right:2px solid var(--blush);border-bottom:2px solid var(--blush);transform:rotate(45deg);animation:scrollB 1.5s ease-in-out infinite}
@keyframes scrollB{0%,100%{transform:rotate(45deg) translateY(0);opacity:1}50%{transform:rotate(45deg) translateY(8px);opacity:.5}}

/* ═══ TIMELINE ═══ */
#memories{background:linear-gradient(180deg,var(--cream),#fce8f4 50%,var(--cream));padding:80px 20px 100px}
.memory-intro{max-width:500px;margin-bottom:50px}
.timeline{position:relative;max-width:600px;width:100%}
.timeline::before{content:'';position:absolute;left:24px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,transparent,var(--blush),var(--lavender),var(--blush),transparent)}
.memory-card{position:relative;margin-bottom:40px;padding-left:60px;text-align:left}
.memory-dot{position:absolute;left:14px;top:8px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--lavender));border:3px solid var(--cream);box-shadow:0 0 0 3px rgba(232,87,138,.2)}
.memory-dot .dot-emoji{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:10px}
.memory-content{background:var(--card-bg);backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:16px;padding:22px;box-shadow:var(--shadow-soft);transition:transform .3s}
.memory-content:hover{transform:translateY(-3px)}
.memory-date{font-size:.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--rose);margin-bottom:6px}
.memory-title{font-family:'Dancing Script',cursive;font-size:1.35rem;color:var(--text-dark);margin-bottom:6px}
.memory-text{font-size:.9rem;color:var(--text-medium);line-height:1.6}
.memory-photo{width:100%;height:200px;border-radius:10px;margin-top:12px;overflow:hidden}
.memory-photo img{width:100%;height:100%;object-fit:cover;display:block}

/* ═══ MEANING ═══ */
#meaning{background:linear-gradient(135deg,#fce4f1,#ede0f8 50%,#dbe8fc);padding:80px 20px}
.meaning-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:700px;width:100%;margin-top:40px}
.meaning-card{background:var(--card-bg);backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:18px;padding:28px 22px;box-shadow:var(--shadow-soft);transition:transform .3s;text-align:left}
.meaning-card:hover{transform:translateY(-5px) scale(1.02)}
.meaning-emoji{font-size:2rem;margin-bottom:12px;display:block}
.meaning-card h3{font-family:'Dancing Script',cursive;font-size:1.3rem;color:var(--deep-rose);margin-bottom:8px}
.meaning-card p{font-size:.9rem;color:var(--text-medium);line-height:1.6}

/* ═══ GALLERY ═══ */
#gallery{background:var(--cream);padding:80px 20px}
.polaroid-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:25px;max-width:700px;width:100%;margin-top:40px}
.polaroid{background:#fff;border-radius:6px;padding:12px 12px 40px;box-shadow:0 4px 20px rgba(0,0,0,.08);transform:rotate(var(--rot,0deg));transition:transform .4s,box-shadow .3s;position:relative}
.polaroid:hover{transform:rotate(0deg) scale(1.05);box-shadow:0 12px 40px rgba(200,80,130,.2)}
.polaroid-inner{width:100%;aspect-ratio:4/3;border-radius:3px;overflow:hidden}
.polaroid-inner img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid-tape{position:absolute;top:-8px;width:50px;height:18px;background:rgba(245,222,179,.7);border-radius:2px;transform:rotate(var(--tape-rot,-3deg))}
.polaroid-tape.left{left:15px}.polaroid-tape.right{right:15px;--tape-rot:3deg}
.polaroid-caption{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:'Dancing Script',cursive;font-size:.95rem;color:var(--text-medium)}

/* ═══ VIDEO ═══ */
#video-section{background:linear-gradient(180deg,var(--cream),#fce8f4);padding:80px 20px}
.video-wrapper{margin-top:30px;max-width:400px;width:100%;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px rgba(200,80,130,.2);border:4px solid #fff}
.video-wrapper video{width:100%;display:block;border-radius:16px}

/* ═══ REASONS ═══ */
#reasons{background:linear-gradient(180deg,#fce8f4,var(--cream));padding:80px 20px}
.reasons-scroll{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;max-width:100%;width:100%;padding:20px 10px 30px;-webkit-overflow-scrolling:touch}
.reasons-scroll::-webkit-scrollbar{height:4px}.reasons-scroll::-webkit-scrollbar-thumb{background:var(--blush);border-radius:2px}
.reason-card{min-width:260px;max-width:300px;scroll-snap-align:center;perspective:800px;flex-shrink:0}
.reason-card-inner{position:relative;width:100%;min-height:200px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.reason-card:hover .reason-card-inner,.reason-card.flipped .reason-card-inner{transform:rotateY(180deg)}
.reason-front,.reason-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.reason-front{background:linear-gradient(135deg,rgba(249,168,201,.4),rgba(216,180,248,.4));backdrop-filter:blur(10px);border:1px solid var(--glass-border);box-shadow:var(--shadow-soft)}
.reason-front .rf-number{font-family:'Dancing Script',cursive;font-size:2.5rem;color:var(--rose);margin-bottom:8px}
.reason-front .rf-label{font-size:.85rem;color:var(--text-light);font-weight:500}
.reason-back{background:linear-gradient(135deg,var(--rose),var(--lavender));transform:rotateY(180deg);color:#fff}
.reason-back p{font-size:1.05rem;line-height:1.6;font-weight:500}
.reason-back .rb-emoji{font-size:1.5rem;margin-top:10px}

/* ═══ CAKE ═══ */
#cake-section{background:var(--cream);padding:80px 20px}
.cake-wrapper{position:relative;margin-top:30px;cursor:pointer}
.cake{position:relative;width:180px}
.cake-layer{margin:0 auto;border-radius:12px;position:relative}
.layer-top{width:100px;height:40px;background:linear-gradient(135deg,#f8a4c8,#e87aaa)}
.layer-mid{width:130px;height:45px;background:linear-gradient(135deg,#f48bb8,#e06a9a);margin-top:-2px}
.layer-bot{width:160px;height:50px;background:linear-gradient(135deg,#f07aa8,#d85a8a);margin-top:-2px;border-radius:12px 12px 16px 16px}
.cake-drip{position:absolute;bottom:-6px;width:12px;height:18px;background:var(--blush);border-radius:0 0 6px 6px}
.candle-row{display:flex;justify-content:center;gap:18px;position:relative;top:-4px}
.candle{width:6px;height:28px;background:linear-gradient(to right,var(--gold-light),var(--gold));border-radius:3px 3px 0 0;position:relative}
.flame{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:10px;height:16px;background:radial-gradient(ellipse,#ffe066 30%,#ff9933 70%,transparent);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flicker .3s ease-in-out infinite alternate;transition:opacity .5s}
.flame.out{opacity:0}
@keyframes flicker{from{transform:translateX(-50%) scale(1) rotate(-3deg)}to{transform:translateX(-50%) scale(1.1,.9) rotate(3deg)}}
.cake-text{margin-top:20px;font-size:.9rem;color:var(--text-light);font-weight:500}
.cake-wish{display:none;margin-top:15px;font-family:'Dancing Script',cursive;font-size:1.4rem;color:var(--deep-rose);animation:fadeScale .6s}
.cake-wish.show{display:block}
@keyframes fadeScale{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

/* ═══ LETTER ═══ */
#letter{background:linear-gradient(180deg,#fce8f4,var(--cream));padding:80px 20px}
.envelope-wrapper{max-width:500px;width:100%;margin-top:30px;cursor:pointer}
.letter-envelope{background:linear-gradient(135deg,#ffe8f0,#fff0f5);border-radius:14px;padding:30px;box-shadow:var(--shadow-soft);border:1px solid rgba(232,87,138,.15);text-align:center;transition:transform .3s}
.letter-envelope:hover{transform:scale(1.02)}
.letter-envelope.opened{display:none}
.le-icon{font-size:2.5rem;margin-bottom:10px}
.le-text{font-family:'Dancing Script',cursive;font-size:1.2rem;color:var(--text-medium)}
.letter-paper{display:none;background:#fff;border-radius:14px;padding:35px 28px;box-shadow:0 8px 40px rgba(200,80,130,.15);border:1px solid rgba(232,87,138,.1);max-width:500px;width:100%;text-align:left;animation:unfold .6s ease forwards}
.letter-paper.show{display:block}
@keyframes unfold{from{opacity:0;transform:scaleY(.3) translateY(-20px)}to{opacity:1;transform:scaleY(1) translateY(0)}}
.letter-greeting{font-family:'Dancing Script',cursive;font-size:1.5rem;color:var(--deep-rose);margin-bottom:15px}
.letter-body{font-size:.95rem;color:var(--text-medium);line-height:1.8;white-space:pre-line}
.letter-sign{margin-top:20px;font-family:'Dancing Script',cursive;font-size:1.2rem;color:var(--rose);text-align:right}

/* ═══ FINALE ═══ */
#finale{min-height:60vh;background:linear-gradient(135deg,#fce4f1,#ede0f8 50%,#dbe8fc);justify-content:center;padding:80px 20px}
.finale-btn{padding:16px 45px;border:none;border-radius:50px;cursor:pointer;background:linear-gradient(135deg,var(--rose),var(--lavender));color:#fff;font-family:'Quicksand',sans-serif;font-size:1.1rem;font-weight:600;box-shadow:0 6px 25px rgba(232,87,138,.35);transition:transform .3s;margin-top:25px}
.finale-btn:hover{transform:scale(1.06)}
.finale-msg{display:none;text-align:center;animation:fadeScale .8s ease forwards}
.finale-msg.show{display:block}
.finale-name{font-family:'Dancing Script',cursive;font-size:clamp(2.5rem,10vw,5rem);background:linear-gradient(135deg,var(--rose),var(--gold),var(--lavender));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s ease infinite}
.finale-hearts{font-size:2rem;margin-top:15px}
.finale-hearts span{display:inline-block;animation:floatH 2s ease-in-out infinite}
.finale-hearts span:nth-child(2){animation-delay:.4s}.finale-hearts span:nth-child(3){animation-delay:.8s}.finale-hearts span:nth-child(4){animation-delay:1.2s}.finale-hearts span:nth-child(5){animation-delay:1.6s}
@keyframes floatH{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.15)}}
.footer-note{margin-top:40px;font-size:.8rem;color:var(--text-light)}

@media(max-width:500px){
  .section{padding:60px 16px}.meaning-grid{grid-template-columns:1fr}
  .polaroid-grid{grid-template-columns:repeat(2,1fr);gap:15px}
  .timeline::before{left:18px}.memory-card{padding-left:48px}.memory-dot{left:8px}
  .letter-paper{padding:25px 20px}.memory-photo{height:160px}
}
</style>
</head>
<body class="no-scroll">

<div class="particles-container" id="particles"></div>

<!-- ENTRY -->
<div id="entry-screen">
  <div class="entry-envelope" id="entry-tap"><div class="envelope-body"></div><div class="envelope-flap"></div><div class="envelope-heart">💌</div></div>
  <div class="entry-text"><h2 id="entry-heading"></h2><p id="entry-sub"></p></div>
  <button class="open-btn" id="open-btn"></button>
</div>

<!-- HERO -->
<section class="section" id="hero">
  <div class="reveal">
    <div class="hero-badge" id="hero-badge"></div>
    <div class="heading-xl" id="hero-title" style="margin-bottom:5px"></div>
    <div class="hero-name" id="hero-name"></div>
    <p class="hero-sub" id="hero-sub"></p>
    <div class="hero-emoji-row"><span>🎂</span><span>🎈</span><span>🎁</span><span>💖</span></div>
  </div>
  <div class="scroll-hint"><span>scroll down</span><div class="scroll-arrow"></div></div>
</section>

<!-- MEMORIES -->
<section class="section" id="memories">
  <div class="reveal memory-intro">
    <span class="section-tag" id="mem-tag"></span>
    <h2 class="heading-lg script" id="mem-heading" style="color:var(--deep-rose);margin-top:8px"></h2>
    <p class="body-text" id="mem-sub" style="margin-top:10px"></p>
  </div>
  <div class="timeline" id="timeline-container"></div>
</section>

<!-- MEANING -->
<section class="section" id="meaning">
  <div class="reveal">
    <span class="section-tag" id="mean-tag"></span>
    <h2 class="heading-lg script" id="mean-heading" style="color:var(--deep-rose);margin-top:8px"></h2>
    <p class="body-text" id="mean-sub" style="margin-top:10px;max-width:500px"></p>
  </div>
  <div class="meaning-grid" id="meaning-grid"></div>
</section>

<!-- GALLERY -->
<section class="section" id="gallery">
  <div class="reveal">
    <span class="section-tag" id="gal-tag"></span>
    <h2 class="heading-lg script" id="gal-heading" style="color:var(--deep-rose);margin-top:8px"></h2>
    <p class="body-text" id="gal-sub" style="margin-top:10px;max-width:450px"></p>
  </div>
  <div class="polaroid-grid" id="polaroid-grid"></div>
</section>

<!-- VIDEO -->
<section class="section" id="video-section">
  <div class="reveal">
    <span class="section-tag">A Special Clip</span>
    <h2 class="heading-lg script" style="color:var(--deep-rose);margin-top:8px" id="video-heading"></h2>
    <p class="body-text" style="margin-top:10px" id="video-sub"></p>
  </div>
  <div class="video-wrapper reveal">
    <video controls playsinline preload="metadata" poster="">
      <source src="photos/video.mp4" type="video/mp4">
    </video>
  </div>
</section>

<!-- REASONS -->
<section class="section" id="reasons">
  <div class="reveal">
    <span class="section-tag" id="rea-tag"></span>
    <h2 class="heading-lg script" id="rea-heading" style="color:var(--deep-rose);margin-top:8px"></h2>
    <p class="body-text" id="rea-sub" style="margin-top:10px"></p>
  </div>
  <div class="reasons-scroll" id="reasons-scroll"></div>
</section>

<!-- CAKE -->
<section class="section" id="cake-section">
  <div class="reveal">
    <span class="section-tag">Make a Wish</span>
    <h2 class="heading-lg script" style="color:var(--deep-rose);margin-top:8px">Your Birthday Cake 🎂</h2>
  </div>
  <div class="cake-wrapper reveal" id="cake-tap">
    <div class="candle-row"><div class="candle"><div class="flame"></div></div><div class="candle"><div class="flame"></div></div><div class="candle"><div class="flame"></div></div></div>
    <div class="cake"><div class="cake-layer layer-top" style="margin:0 auto"><div class="cake-drip" style="left:15px"></div><div class="cake-drip" style="right:15px"></div></div><div class="cake-layer layer-mid" style="margin:0 auto"><div class="cake-drip" style="left:20px"></div><div class="cake-drip" style="right:25px"></div></div><div class="cake-layer layer-bot" style="margin:0 auto"></div></div>
    <p class="cake-text" id="cake-text"></p>
    <p class="cake-wish" id="cake-wish"></p>
  </div>
</section>

<!-- LETTER -->
<section class="section" id="letter">
  <div class="reveal">
    <span class="section-tag">A Letter For You</span>
    <h2 class="heading-lg script" style="color:var(--deep-rose);margin-top:8px">Words From the Heart</h2>
  </div>
  <div class="envelope-wrapper reveal">

function applyConfig(){
  const s=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  s('entry-heading',CONFIG.entryHeading);s('entry-sub',CONFIG.entrySub);s('open-btn',CONFIG.entryBtn);
  s('hero-badge',CONFIG.heroBadge);s('hero-title',CONFIG.heroTitle);s('hero-name',CONFIG.name);s('hero-sub',CONFIG.heroSub);
  s('mem-tag',CONFIG.memTag);s('mem-heading',CONFIG.memHeading);s('mem-sub',CONFIG.memSub);
  s('mean-tag',CONFIG.meanTag);s('mean-heading',CONFIG.meanHeading);s('mean-sub',CONFIG.meanSub);
  s('gal-tag',CONFIG.galTag);s('gal-heading',CONFIG.galHeading);s('gal-sub',CONFIG.galSub);
  s('video-heading',CONFIG.videoHeading);s('video-sub',CONFIG.videoSub);
  s('rea-tag',CONFIG.reaTag);s('rea-heading',CONFIG.reaHeading);s('rea-sub',CONFIG.reaSub);
  s('cake-text',CONFIG.cakeText);s('letter-greeting',CONFIG.letterGreeting);s('letter-sign',CONFIG.letterSign);
  s('finale-line',CONFIG.finaleLine);s('finale-name',CONFIG.name);s('finale-wish',CONFIG.finaleWish);s('footer-note',CONFIG.footerNote);
  document.title=`Happy Birthday ${CONFIG.name} 🎂`;
}
function buildMemories(){
  const c=document.getElementById('timeline-container');c.innerHTML='';
  CONFIG.memories.forEach(m=>{
    c.innerHTML+=`<div class="memory-card reveal"><div class="memory-dot"><span class="dot-emoji">${m.emoji}</span></div>
      <div class="memory-content"><p class="memory-date">${m.date}</p><h3 class="memory-title">${m.title}</h3><p class="memory-text">${m.text}</p>
      <div class="memory-photo"><img src="${m.photo}" alt="${m.title}" loading="lazy"></div></div></div>`;
  });
}
function buildMeanings(){
  const g=document.getElementById('meaning-grid');g.innerHTML='';
  CONFIG.meanings.forEach(m=>{g.innerHTML+=`<div class="meaning-card reveal"><span class="meaning-emoji">${m.emoji}</span><h3>${m.title}</h3><p>${m.text}</p></div>`;});
}
function buildGallery(){
  const g=document.getElementById('polaroid-grid');g.innerHTML='';
  const r=[-3,2,-1.5,2.5,-2,1.5];
  CONFIG.photos.forEach((p,i)=>{
    g.innerHTML+=`<div class="polaroid reveal" style="--rot:${r[i%r.length]}deg"><div class="polaroid-tape left"></div>
      <div class="polaroid-inner"><img src="${p.src}" alt="${p.caption}" loading="lazy"></div>
      <span class="polaroid-caption">${p.caption}</span></div>`;
  });
}
function buildReasons(){
  const s=document.getElementById('reasons-scroll');s.innerHTML='';
  CONFIG.reasons.forEach((r,i)=>{
    s.innerHTML+=`<div class="reason-card reveal" onclick="this.classList.toggle('flipped')"><div class="reason-card-inner">
      <div class="reason-front"><span class="rf-number">#${i+1}</span><span class="rf-label">tap to reveal</span></div>
      <div class="reason-back"><p>${r.text}</p><span class="rb-emoji">${r.emoji}</span></div></div></div>`;
  });
}
function createParticles(){
  const c=document.getElementById('particles'),cols=['#F9A8C9','#D8B4F8','#F5DEB3','#FFB6C1','#E8D5F0'],em=['❤️','✨','🌸','💕','⭐'];
  for(let i=0;i<25;i++){const p=document.createElement('div');p.className='particle';
    if(Math.random()>.5){p.textContent=em[~~(Math.random()*em.length)];p.style.fontSize=(8+Math.random()*14)+'px';}
    else{const sz=4+Math.random()*10;p.style.width=sz+'px';p.style.height=sz+'px';p.style.background=cols[~~(Math.random()*cols.length)];}
    p.style.left=Math.random()*100+'%';p.style.animationDuration=(10+Math.random()*20)+'s';p.style.animationDelay=Math.random()*15+'s';c.appendChild(p);}
}
function setupReveal(){
  const obs=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('visible');});},{threshold:.15});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}
function setupEntry(){
  const entry=document.getElementById('entry-screen');
  const go=()=>{confetti({particleCount:120,spread:80,origin:{y:.6},colors:['#F9A8C9','#D8B4F8','#F5DEB3','#E8578A','#FFB6C1']});
    setTimeout(()=>confetti({particleCount:60,spread:100,origin:{y:.5}}),300);
    entry.classList.add('hide');document.body.classList.remove('no-scroll');setTimeout(()=>entry.style.display='none',800);};
  document.getElementById('open-btn').addEventListener('click',go);document.getElementById('entry-tap').addEventListener('click',go);
}
function setupCake(){
  let blown=false;document.getElementById('cake-tap').addEventListener('click',()=>{
    if(blown)return;blown=true;document.querySelectorAll('.flame').forEach(f=>f.classList.add('out'));
    setTimeout(()=>{document.getElementById('cake-wish').classList.add('show');document.getElementById('cake-text').style.display='none';
      confetti({particleCount:80,spread:70,origin:{y:.7},colors:['#F9A8C9','#D8B4F8','#F5DEB3']});},500);});
}
function setupLetter(){
  document.getElementById('envelope-tap').addEventListener('click',()=>{
    document.getElementById('envelope-tap').classList.add('opened');document.getElementById('letter-paper').classList.add('show');
    const full=CONFIG.letterBody,el=document.getElementById('letter-body');el.textContent='';let i=0;
    const t=()=>{if(i<full.length){el.textContent+=full[i];i++;setTimeout(t,i%40===0?60:18);}};t();});
}
function setupFinale(){
  document.getElementById('finale-btn').addEventListener('click',()=>{
    document.getElementById('finale-btn').style.display='none';document.getElementById('finale-msg').classList.add('show');
    const end=Date.now()+3000;const iv=setInterval(()=>{if(Date.now()>end)return clearInterval(iv);
      confetti({particleCount:30,spread:80,startVelocity:45,origin:{x:Math.random(),y:Math.random()*.4},
        colors:['#F9A8C9','#D8B4F8','#F5DEB3','#E8578A','#FFB6C1','#D4A853']});},200);});
}
function init(){applyConfig();buildMemories();buildMeanings();buildGallery();buildReasons();createParticles();setupEntry();setupCake();setupLetter();setupFinale();requestAnimationFrame(()=>setupReveal());}
document.addEventListener('DOMContentLoaded',init);
